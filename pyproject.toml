[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videohub-control"
version = "7.0.6"
description = "Contrôle web des routeurs Blackmagic Videohub (protocole Ethernet TCP 9990)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
videohub-control = "videohub_control.__main__:main"

[tool.setuptools]
packages = ["videohub_control"]

[tool.setuptools.package-data]
videohub_control = ["web/*"]
